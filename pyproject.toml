[project]
name = "industry-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.7.0",
    "streamlit>=1.67.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

# 1) 删掉模板生成的整段，它指向已改名的模块，留着运行时会报 ModuleNotFoundError
#[project.scripts]
#industry-research-agent = "industry_research_agent:main"
# 2) 追加：告诉构建后端模块叫 agent
[tool.uv.build-backend]
module-name = "agent"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
